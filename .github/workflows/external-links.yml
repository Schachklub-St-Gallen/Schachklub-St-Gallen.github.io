name: External links
on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  TITLE: Kaputte externe Links
jobs:
  check:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # Build failures fail the run here and never touch the issue.
      - name: Build site and check internal links
        run: script/check
      - name: Check external links
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          script/check --external --skip-build 2>&1 | tee report.txt
      - name: Open or update issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # htmlproofer starts each failing check with "For the <check> check": Links, Images, Scripts…
          excerpt=$(sed -n '/^For the /,$p' report.txt)
          [ -n "$excerpt" ] || excerpt=$(tail -c 20000 report.txt)
          {
            echo "> *Automatisch erstellt vom Workflow [External links](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).*"
            echo
            echo '```'
            printf '%s\n' "$excerpt" | head -c 60000
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label bug
          fi
      - name: Close issue when all links work
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "> *Automatisch geschlossen: der Workflow [External links](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) findet keine kaputten Links mehr.*"
          fi
      - name: Fail if links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
