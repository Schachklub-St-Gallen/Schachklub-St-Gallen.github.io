name: External links
on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build site and check external links
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          script/check --external 2>&1 | tee report.txt
      - name: Open or update issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Kaputte externe Links
        run: |
          {
            echo "> *Automatisch erstellt vom Workflow [External links](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).*"
            echo
            echo '```'
            sed -n '/For the Links > External check/,$p' report.txt | head -c 60000
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label bug
          fi
      - name: Fail if links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
